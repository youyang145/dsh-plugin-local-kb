name: check

on:
  push:
  pull_request:

jobs:
  sync-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: 检出插件仓
        uses: actions/checkout@v4
      - name: 检出核心仓
        uses: actions/checkout@v4
        with:
          repository: youyang145/local-experience-kb-mvp
          path: core
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 副本一致性
        run: node scripts/check-sync.mjs core
      - name: 冒烟（假 ctx 跑六个工具）
        run: node harness.mjs
